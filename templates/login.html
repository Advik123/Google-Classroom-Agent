<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — The Scriptum</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .login-card {
        width: 100%;
        max-width: 380px;
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
        border-radius: 18px;
        padding: 2.4rem 2rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.15rem;
      }

      .login-brand {
        margin: 0 0 0.2rem;
        font-family: "Playfair Display", serif;
        font-size: 1.65rem;
        color: #ece6d7;
        text-align: center;
      }

      .login-subtitle {
        margin: 0;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .login-label {
        display: block;
        font-size: 0.83rem;
        color: #cfc8ba;
        margin-bottom: 0.4rem;
      }

      .login-input {
        width: 100%;
        padding: 0.64rem 0.75rem;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 15, 19, 0.72);
        color: var(--text);
        font: inherit;
        font-size: 1rem;
      }

      .login-input:focus {
        outline: 2px solid rgba(233, 195, 73, 0.45);
        outline-offset: 1px;
      }

      .login-error {
        margin: 0;
        padding: 0.55rem 0.75rem;
        border-radius: 8px;
        background: rgba(216, 77, 77, 0.18);
        border: 1px solid rgba(216, 77, 77, 0.35);
        color: #f4b8b8;
        font-size: 0.87rem;
      }

      .login-btn {
        width: 100%;
        padding: 0.68rem;
        border: 1px solid rgba(233, 195, 73, 0.4);
        border-radius: 10px;
        background: linear-gradient(135deg, #c59e2d 0%, #8f6b0f 100%);
        color: #fef8eb;
        font: inherit;
        font-size: 0.97rem;
        cursor: pointer;
        margin-top: 0.2rem;
      }

      .login-btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <h1 class="login-brand">The Scriptum</h1>
        <p class="login-subtitle">Enter your password to continue</p>

        {% if error %}
          <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST" autocomplete="off" novalidate>
          <label for="password" class="login-label">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="login-input"
            autofocus
            required
            placeholder="••••••••"
          />
          <button type="submit" class="login-btn" style="margin-top: 1rem;">
            Sign In
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
